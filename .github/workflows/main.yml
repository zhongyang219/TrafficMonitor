        & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
        if ($LASTEXITCODE -ne 0) { throw "MFC installation failed: $LASTEXITCODE" }

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x86 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/Release (lite)/TrafficMonitor.exe
          Bin/Release (lite)/*.dll
      
    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/Release (lite)/*.pdb

  arm64ec_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3
      
    - name: Install Visual C++ MFC libraries
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -property installationPath
        if (-not $vs) { throw "Visual Studio installation not found" }
        $installer = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vs_installer.exe"
        & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
        if ($LASTEXITCODE -ne 0) { throw "MFC installation failed: $LASTEXITCODE" }

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=ARM64EC -p:platformToolset=v143
      
